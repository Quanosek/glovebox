services:
  app:
    build: .
    user: "${GLOVEBOX_UID:-1000}:${GLOVEBOX_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${GLOVEBOX_BIND_ADDRESS:-0.0.0.0}:${GLOVEBOX_PORT:-3000}:3000"
    environment:
      MANUALS_ALLOW_REMOTE_IMPORT: "${MANUALS_ALLOW_REMOTE_IMPORT:-1}"
    volumes:
      - ./database:/app/database
      - ./.runtime/tmp:/app/tmp
      - ./.runtime/cache:/app/.next/cache
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
